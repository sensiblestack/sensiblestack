<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <rect x="10" y="10" width="1080" height="540" rx="24" fill="#0E3A45"/>
  <text x="56" y="86" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">The stack, in buying order</text>
  <text x="56" y="122" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#7FC6B8">Five jobs. Bought in sequence, each one earning its place.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="56" y="158" width="988" height="62" rx="12" fill="#F2A93B"/>
    <circle cx="96" cy="189" r="19" fill="#0E3A45"/><text x="96" y="197" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="134" y="197" font-size="22" font-weight="700" fill="#0E3A45">A website that runs itself</text>
    <rect x="56" y="234" width="880" height="62" rx="12" fill="#ffffff"/>
    <circle cx="96" cy="265" r="19" fill="#0E3A45"/><text x="96" y="273" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="134" y="273" font-size="22" font-weight="700" fill="#0E3A45">An email list you own</text>
    <rect x="56" y="310" width="772" height="62" rx="12" fill="#7FC6B8"/>
    <circle cx="96" cy="341" r="19" fill="#0E3A45"/><text x="96" y="349" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="134" y="349" font-size="22" font-weight="700" fill="#0E3A45">A CRM, starting free</text>
    <rect x="56" y="386" width="664" height="62" rx="12" fill="#ffffff" opacity="0.85"/>
    <circle cx="96" cy="417" r="19" fill="#0E3A45"/><text x="96" y="425" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="134" y="425" font-size="22" font-weight="700" fill="#0E3A45">Getting found on Google</text>
    <rect x="56" y="462" width="556" height="62" rx="12" fill="#ffffff" opacity="0.65"/>
    <circle cx="96" cy="493" r="19" fill="#0E3A45"/><text x="96" y="501" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="134" y="501" font-size="22" font-weight="700" fill="#0E3A45">One place to run the work</text>
  </g>
